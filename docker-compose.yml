services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mockmate
      POSTGRES_PASSWORD: mockmate
      POSTGRES_DB: mockmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockmate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: