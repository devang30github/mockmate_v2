<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard: MockMate</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MockMate</a>
    <nav aria-label="Account">
      <span id="user-email" class="muted"></span>
      <button id="logout" class="btn" type="button">Log out</button>
    </nav>
  </header>

  <main id="app" class="container" hidden>
    <h1>Your dashboard</h1>
    <div id="dash-error" class="error" role="alert" hidden></div>

    <section class="card">
      <h2>Start a mock interview</h2>
      <p class="muted">Upload a resume, add a job description, and choose your settings.</p>
      <a class="btn primary" href="/setup.html">New interview</a>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Your interviews</h2>
      <div id="interviews"></div>
    </section>
  </main>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
